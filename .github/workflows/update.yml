name: 更新補位行事曆

# 只手動觸發：使用者想更新行程時才跑（gh workflow run "更新補位行事曆"）。
# 原本有每天三次的 schedule，拿掉了 —— 不需要自動刷新。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓名額、產生 ICS
        run: python build_ics.py

      - name: 有變動才 commit
        run: |
          git config user.name "hiking-ics bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data.json 每次都會因為 updated 時間戳而變，所以看 ics 有沒有實質變動
          if git diff --quiet -- docs/hiking.ics; then
            echo "名額沒變，不 commit"
          else
            git add docs/hiking.ics docs/data.json
            git commit -m "更新名額 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
            git push
          fi
